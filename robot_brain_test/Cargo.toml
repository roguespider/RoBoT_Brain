[package]
name = "robot_brain_test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "robot_brain_test"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = "2"
flate2 = "1"
tar = "0.4"
regex = "1"
