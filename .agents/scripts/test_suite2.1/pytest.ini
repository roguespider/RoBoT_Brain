[pytest]
testpaths = .
python_files = *.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
pythonpath = .
addopts = --strict-markers --durations=10 --tb=short
markers =
    memory: Memory Engine tests
    knowledge: Knowledge Engine tests
    experience: Experience Engine tests
    planning: Planning Engine tests
    restart: Persistence/restart tests
    coverage: Coverage gap analysis
    integration: Cross-system integration tests
    fast: Fast smoke tests (no restart)
    research: Research Engine full flow tests
    timeout: Test timeout marker
