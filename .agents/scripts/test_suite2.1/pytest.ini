[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
pythonpath = .
addopts = --ignore=test_tool_probe.py
markers =
    memory: Memory Engine tests
    knowledge: Knowledge Engine tests
    experience: Experience Engine tests
    planner: Planning Engine tests
    restart: Persistence/restart tests
    coverage: Coverage gap analysis
    integration: Cross-system integration tests
    fast: Fast smoke tests (no restart)
    research: Research Engine full flow tests
