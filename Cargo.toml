[package]
name = "robot_brain"
version = "0.1.0"
edition = "2021"

[build-dependencies]

[dependencies]
rmcp = { version = "2", features = ["server", "client", "transport-io", "macros", "transport-child-process"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
walkdir = "2"
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
sha2 = "0.10"
lazy_static = "1"
dirs = "5"
rusqlite = { version = "0.32", features = ["load_extension", "bundled"] }
zerocopy = { version = "0.7", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"

# Audio transcription - placeholder for Candle Whisper integration
# TODO: Implement Whisper transcription with Candle
# Candle dependencies will be added when implementation is complete
# candle-core = "0.8.0"
# candle-transformers = "0.8.0"
# hf-hub = "0.4.0" # Downloads Whisper models from HuggingFace
# tokenizers = "0.21.0" # Tokenizer for Whisper
hound = "3.5" # Loads WAV audio files

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }
