[package]
name = "test_suite"
version = "0.1.0"
edition = "2024"
description = "Comprehensive test suite for RoBoT Brain MCP Server"
license = "AGPL-3.0-or-later"
authors = ["RoBoT Team"]

[[bin]]
name = "test_suite"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = "2"
flate2 = "1"
tar = "0.4"
regex = "1"
