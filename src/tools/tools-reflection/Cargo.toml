[package]
name = "tools-reflection"
version = "0.1.0"
edition = "2024"
description = "Reflection and pattern analysis tools for RoBoT Brain"

[dependencies]
tools-core = { path = "../tools-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "2.1", features = ["server"] }

[lib]
crate-type = ["cdylib"]
