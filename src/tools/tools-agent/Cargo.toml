[package]
name = "tools-agent"
version = "0.1.0"
edition = "2021"
description = "Agent and MCP server tools for RoBoT Brain"

[dependencies]
tools-core = { path = "../tools-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "2", features = ["server"] }

[lib]
crate-type = ["cdylib"]
